services:
  - type: web
    name: blueharvest-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/diagnostics
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blueharvest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://blueharvest.netlify.app"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
      - key: MODAL_ENABLED
        value: "true"
      - key: MODAL_BASE_URL
        value: "https://subodhwalondre87--blueharvest-p2pnet-p2pnetservice-web.modal.run"
      - key: MODAL_KEY
        sync: false
      - key: MODAL_SECRET
        sync: false
      - key: DEMO_MODE_ENABLED
        value: "false"
      - key: DEV_EXPOSE_OTP
        value: "false"

databases:
  - name: blueharvest-db
    databaseName: blueharvest
    user: blueharvest_user
    plan: free
