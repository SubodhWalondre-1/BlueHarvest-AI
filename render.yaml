services:
  - type: web
    name: blueharvest-api
    runtime: python
    rootDir: blueharvest-backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/diagnostics
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        # Set to your permanent Neon.tech Serverless PostgreSQL connection string (neondb)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        value: "https://blueharvest-ai.netlify.app"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
      - key: UPLOAD_STORAGE_PERSISTENT
        value: "false"
      - key: STORAGE_TIMEOUT_SECONDS
        value: "20"
      - key: MODAL_ENABLED
        value: "true"
      - key: MODAL_BASE_URL
        value: "https://subodhwalondre87--blueharvest-p2pnet-p2pnetservice-web.modal.run"
      - key: MODAL_KEY
        sync: false
      - key: MODAL_SECRET
        sync: false
      - key: MODAL_IMAGE_FIELD
        value: "file"
      - key: MODAL_COUNT_FIELD
        value: "count"
      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: DEV_EXPOSE_OTP
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 537540751411-6b4bomsui4f4co6ki1jq1m1vt4pt41na.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_ROUTE
        value: "otp"
      - key: FAST2SMS_SENDER_ID
        sync: false
      - key: RETAIN_ALL_UPLOADS
        value: "true"

