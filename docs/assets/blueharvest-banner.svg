      <use href="#fish" transform="translate(74 57) scale(0.33)" color="#B8F4FF" />
      <text x="103" y="62" fill="#A4E8F5" font-size="12" font-weight="600" letter-spacing="2.3">BLUEHARVEST AI / AQUACULTURE VISION</text>
      <text x="58" y="159" fill="#FFFFFF" font-size="66" font-weight="700" letter-spacing="-2.6">A clearer view.</text>
      <text x="58" y="231" fill="#8EE8F5" font-size="66" font-weight="700" letter-spacing="-2.6">For every hatch.</text>
      <text x="62" y="271" fill="#CAE8F5" font-size="18">Computer vision for the water you care for.</text>
      <g fill="none" stroke="#A7EBF9" stroke-opacity="0.29">
