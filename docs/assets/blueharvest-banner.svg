    <circle cx="940" cy="210" r="132" fill="#041D40" fill-opacity="0.35" stroke="#72D4EF" stroke-width="2" stroke-opacity="0.5" />
    <circle cx="940" cy="210" r="120" fill="url(#water)" stroke="#80DEEF" stroke-opacity="0.5" />
