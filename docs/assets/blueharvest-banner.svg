      <text x="940" y="56" fill="#BAEFF9" font-size="10" font-weight="600" letter-spacing="1.6">BUILT FOR HATCHERIES</text>
      <text x="940" y="369" fill="#B7EFF8" font-size="10" letter-spacing="2.1">VISION MEETS AQUACULTURE</text>
    </g>
    <use href="#fish" transform="translate(1117 104) rotate(-23) scale(0.34)" color="#7FD7E9" opacity="0.32" />
    <use href="#fish" transform="translate(1133 129) rotate(-23) scale(0.25)" color="#7FD7E9" opacity="0.24" />
    <circle cx="746" cy="90" r="4" fill="none" stroke="#8BE2F0" stroke-opacity="0.24" />
    <circle cx="1114" cy="307" r="6" fill="none" stroke="#8BE2F0" stroke-opacity="0.25" />
