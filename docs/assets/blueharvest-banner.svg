        <rect x="183" y="308" width="102" height="33" rx="16.5" />
        <rect x="295" y="308" width="155" height="33" rx="16.5" />
      </g>
      <g fill="#E2F8FF" font-size="10" font-weight="600" letter-spacing="1.7" text-anchor="middle">
