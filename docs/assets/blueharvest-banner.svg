      <use href="#fish" transform="translate(965 143) rotate(164) scale(0.52)" color="#80DDE9" />
      <use href="#fish" transform="translate(1011 186) rotate(126) scale(0.64)" color="#D5F8F7" />
      <use href="#fish" transform="translate(940 202) rotate(20) scale(0.8)" color="#A0EAF2" />
      <use href="#fish" transform="translate(872 218) rotate(-62) scale(0.55)" color="#77D8E9" />
      <use href="#fish" transform="translate(910 260) rotate(-36) scale(0.72)" color="#D5F8F7" />
      <use href="#fish" transform="translate(986 259) rotate(165) scale(0.56)" color="#92E3ED" />
      <use href="#fish" transform="translate(954 290) rotate(-155) scale(0.43)" color="#B7EEF2" />
      <g fill="none" stroke="#BCF5FF" stroke-opacity="0.35">
        <circle cx="900" cy="181" r="4" />
        <circle cx="973" cy="224" r="3" />
        <circle cx="1008" cy="229" r="5" />
        <circle cx="929" cy="119" r="3" />
