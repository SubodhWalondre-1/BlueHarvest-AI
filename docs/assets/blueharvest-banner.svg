<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">BlueHarvest AI - A clearer view for every hatch</title>
  <desc id="description">An ocean-blue banner with layered water, a circular nursery basin, and a school of fish.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061B3C" />
      <stop offset="0.58" stop-color="#073E74" />
      <stop offset="1" stop-color="#077EAB" />
    </linearGradient>
    <radialGradient id="water">
      <stop stop-color="#0F9BC4" />
      <stop offset="0.72" stop-color="#0877A5" />
      <stop offset="1" stop-color="#075281" />
    </radialGradient>
    <radialGradient id="light">
      <stop stop-color="#66E4F5" stop-opacity="0.19" />
      <stop offset="1" stop-color="#66E4F5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop stop-color="#1475B0" stop-opacity="0.2" />
      <stop offset="1" stop-color="#39C4DC" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="dots" width="27" height="27" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#B6F3FA" fill-opacity="0.15" />
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="420" rx="24" /></clipPath>
    <clipPath id="basin"><circle cx="940" cy="210" r="119" /></clipPath>
    <g id="fish">
      <path d="M-21 0C-12-13 6-14 17-5L31-14V14L17 5C6 14-12 13-21 0Z" fill="currentColor" />
      <circle cx="-11" cy="-2" r="2.2" fill="#063D68" />
      <path d="M-3-8 4-17 12-9" fill="currentColor" opacity="0.6" />
    </g>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="420" fill="url(#ocean)" />
    <rect x="650" width="550" height="420" fill="url(#dots)" />
    <ellipse cx="1024" cy="116" rx="365" ry="330" fill="url(#light)" />
    <path d="M0 319C213 254 385 396 604 338S969 262 1200 315V420H0Z" fill="url(#wave)" />
    <path d="M0 359C245 297 418 409 678 365S1016 307 1200 355V420H0Z" fill="#0C7BA9" fill-opacity="0.5" />
    <path d="M0 388C217 338 399 431 682 392S1039 363 1200 391V420H0Z" fill="#2BB1C8" fill-opacity="0.22" />
    <path d="M0 320C213 255 385 396 604 338S969 262 1200 315" fill="none" stroke="#74E4F0" stroke-opacity="0.19" />
