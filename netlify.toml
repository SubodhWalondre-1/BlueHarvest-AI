[build]
  base = "blueharvest-frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_URL = "https://blueharvest-api.onrender.com"
  VITE_GOOGLE_CLIENT_ID = "537540751411-6b4bomsui4f4co6ki1jq1m1vt4pt41na.apps.googleusercontent.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
